<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynapseTwin Sequence Diagrams & Architecture Viewer</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --primary: #0F766E;
      --primary-light: #CCFBF1;
      --accent: #FFC83D;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #0F766E;
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #0F172A;
    }
    .header-links a {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .header-links a:hover {
      background: var(--primary);
      color: #FFFFFF;
    }
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* Sidebar */
    aside {
      width: 340px;
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-category {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-top: 12px;
      margin-bottom: 4px;
      padding-left: 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      transition: all 0.15s ease;
      width: 100%;
    }
    .nav-item:hover {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }
    .nav-item.active {
      background: #E6FFFA;
      border-color: #0F766E;
      color: #0F766E;
      font-weight: 600;
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      background: #E2E8F0;
      border-radius: 4px;
      color: #475569;
      flex-shrink: 0;
    }
    .nav-item.active .nav-badge {
      background: #0F766E;
      color: #FFFFFF;
    }
    .nav-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Viewer stage */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .toolbar {
      padding: 12px 24px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .title-box h2 {
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      cursor: pointer;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #F8FAFC;
      border-color: #94A3B8;
    }
    .btn-primary {
      background: #0F766E;
      color: #FFFFFF;
      border-color: #0F766E;
    }
    .btn-primary:hover {
      background: #0D655E;
    }
    .viewport {
      flex: 1;
      overflow: auto;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(#CBD5E1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .diagram-card {
      background: #FFFFFF;
      border: 2px solid #1E293B;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 6px 6px 0px #1E293B;
      max-width: 100%;
      max-height: 100%;
      overflow: auto;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }
    .diagram-card svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
    }
    /* Code drawer */
    .code-panel {
      background: #0F172A;
      color: #F8FAFC;
      border-top: 2px solid #1E293B;
      max-height: 220px;
      overflow-y: auto;
      padding: 16px 24px;
      font-family: "JetBrains Mono", Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }
    .code-panel.open {
      display: block;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #94A3B8;
      font-weight: bold;
    }
  </style>
</head>

 | 'frustrated' | 'hesitant' | 'fatigued')\n\n        alt Positive State ('calm_flow' or 'energized')\n            EMILY->>Theme: Smoothly transitions ambient tokens (Teal #0D9488 or Terracotta #D96B43)\n            Theme->>User: Updates doodle card glow & BRIAN expression (WCAG >= 4.5:1 ink locked)\n        else Stressed / Low-Energy State ('frustrated', 'hesitant', or 'fatigued')\n            EMILY->>Pill: Triggers gentle BRIAN check-in (\"Pace felt intense—switch to Calm Mode?\")\n            Pill->>User: Requests explicit Human Approval [Apply Calm Palette] / [Keep Current]\n            opt User Approves Adaptation (or Manually Selects via Mood Pill)\n                User->>Theme: Applies counter-regulatory Sage (#4D9078), Periwinkle (#5A67D8), or Indigo (#5C6B9C)\n                Theme->>User: Softens visual density & slows task pacing\n            end\n        end\n    end","svg":"<svg id=\"m_8\" width=\"2816.5\" xmlns=\"http://www.w3.org/2000/svg\" height=\"953\" viewBox=\"-50 -10 2816.5 953\" role=\"graphics-document document\" aria-roledescription=\"sequence\"><g><line id=\"actor41\" x1=\"2563\" y1=\"65\" x2=\"2563\" y2=\"2000\" class=\"actor-line 200\" stroke-width=\"0.5px\" stroke=\"#999\" name=\"Theme\" data-et=\"life-line\" data-id=\"Theme\"></line><g id=\"root-41\" data-et=\"participant\" data-type=\"participant\" data-id=\"Theme\"><rect x=\"2409.5\" y=\"0\" fill=\"#eaeaea\" stroke=\"#666\" width=\"307\" height=\"65\" name=\"Theme\" rx=\"3\" ry=\"3\" class=\"actor actor-top\"></rect><text x=\"2563\" y=\"32.5\" dominant-baseline=\"central\" alignment-baseline=\"central\" class=\"actor actor-box\" style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;\"><tspan x=\"2563\" dy=\"0\">CSS Token Adapter (html[data-emotion])</tspan></text></g></g><g><line id=\"actor40\" x1=\"2256\" y1=\"65\" x2=\"2256\" y2=\"2000\" class=\"actor-line 200\" stroke     let activeIndex = 0;
    let currentScale = 1.0;

    function renderNav() {
      const nav = document.getElementById('nav-list');
      let currentCat = '';
      diagrams.forEach((d, idx) => {
        if (d.category !== currentCat) {
          currentCat = d.category;
          const catEl = document.createElement('div');
          catEl.className = 'nav-category';
          catEl.textContent = currentCat;
          nav.appendChild(catEl);
        }
        const item = document.createElement('button');
        item.className = 'nav-item' + (idx === 0 ? ' active' : '');
        item.innerHTML = `<span class="nav-badge">${d.num}</span><span class="nav-label">${d.title}</span>`;
        item.onclick = () => selectDiagram(idx);
        nav.appendChild(item);
      });
    }

    function selectDiagram(idx) {
      activeIndex = idx;
      currentScale = 1.0;
      updateTransform();
      const d = diagrams[idx];
      document.getElementById('active-title').textContent = d.title;
      document.getElementById('svg-container').innerHTML = d.svg;
      document.getElementById('mermaid-code').textContent = d.code;
      document.getElementById('btn-svg').href = d.svgFile;
      document.getElementById('btn-png').href = d.pngFile;

      document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
    }

    function zoomIn() {
      currentScale = Math.min(2.5, currentScale + 0.15);
      updateTransform();
    }

    function zoomOut() {
      currentScale = Math.max(0.4, currentScale - 0.15);
      updateTransform();
    }

    function resetZoom() {
      currentScale = 1.0;
      updateTransform();
    }

    function updateTransform() {
      const card = document.getElementById('diagram-card');
      card.style.transform = `scale(${currentScale})`;
    }

    function toggleCode() {
      const panel = document.getElementById('code-panel');
      panel.classList.toggle('open');
    }

    function copyCode() {
      const code = diagrams[activeIndex].code;
      navigator.clipboard.writeText(code);
      alert('Mermaid source copied to clipboard!');
    }

    renderNav();
    selectDiagram(0);
  </script>
