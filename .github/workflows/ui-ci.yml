name: UI & Python Verification

on:
  push:
    branches: [main, ui/main, 'ui/**', 'feat/**']
  pull_request:
    branches: [main, ui/main, 'feat/**']

jobs:
  verify:
    name: Typecheck, Token Lint, Copy Guardrail, Contrast, Unit & E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (version from frontend/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Design Token Linter
        run: npm run lint:tokens

      - name: Non-Clinical Copy Guardrail Linter
        run: npm run lint:copy

      - name: WCAG 2.1 AA/AAA Contrast Checker
        run: npm run check:contrast

      - name: Vitest Unit Suite
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & Axe-core A11y Suite
        run: npx playwright test

  python:
    name: Python Tests (API, coach, module packages, root scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: '**/requirements.txt'

      - name: Setup Node.js for the root script tests (version from frontend/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install the Python Workspace
        run: pip install -r requirements.txt

      - name: Pytest (root pytest.ini collects every suite)
        run: python -m pytest -q
