[pytest]
# `pytest` from the repo root runs every suite. The API keeps its own pytest.ini for `cd assessment_engine/api && pytest`.
pythonpath = . assessment_engine/api
testpaths =
    tests
    assessment_engine/api/tests
    ai_coach/tests
    brain_twin_jepa/tests
    clustering_engine/tests
    dynamic_cache/tests
# Package suites may reuse test file names (test_api.py) without __init__.py files.
addopts = --import-mode=importlib
