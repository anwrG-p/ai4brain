[pytest]
# `pytest` from the repo root runs every suite, the API server's (backend/tests) included.
pythonpath = . backend
testpaths =
    tests
    backend/tests
    ai_coach/tests
    brain_twin_jepa/tests
    clustering_engine/tests
    dynamic_cache/tests
# Package suites may reuse test file names (test_api.py) without __init__.py files.
addopts = --import-mode=importlib
